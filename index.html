<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Son's Academic Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans pb-12">

  <!-- Top Bar Header -->
  <header class="bg-slate-800 border-b border-slate-700 p-4 sticky top-0 z-50 shadow-md">
    <div class="max-w-6xl mx-auto flex justify-between items-center">
      <h1 class="text-xl font-bold text-amber-400 flex items-center gap-2">
        <span>🎓</span> Academic Command Center
      </h1>
      <button onclick="fetchData()" class="bg-amber-500 hover:bg-amber-600 text-slate-950 font-semibold px-4 py-2 rounded-lg text-sm transition flex items-center gap-1.5">
        🔄 Refresh Data
      </button>
    </div>
  </header>

  <main class="max-w-6xl mx-auto p-4 md:p-6 space-y-8">
    
    <!-- View Navigation Tabs -->
    <div class="flex gap-2 border-b border-slate-800 pb-2">
      <button onclick="switchTab('dashboard')" id="btn-dashboard" class="px-4 py-2 rounded-lg font-medium text-amber-400 bg-slate-800 border border-slate-700">
        📌 Daily Dashboard
      </button>
      <button onclick="switchTab('classes')" id="btn-classes" class="px-4 py-2 rounded-lg font-medium text-slate-400 hover:bg-slate-800 transition">
        📚 Class Breakdown
      </button>
    </div>

    <!-- 1. DASHBOARD VIEW -->
    <div id="view-dashboard" class="space-y-6">
      
      <!-- Alert Cards Grid -->
      <div class="grid grid-cols-1 md:grid-cols-3 gap-5">
        
        <!-- Due Today -->
        <div class="bg-red-950/40 border border-red-800/60 p-5 rounded-xl shadow-lg">
          <h2 class="text-red-400 font-bold text-lg flex items-center gap-2 mb-3">
            🚨 Due Today
          </h2>
          <div id="list-due-today" class="space-y-2.5">Loading assignments...</div>
        </div>

        <!-- Homework Tonight -->
        <div class="bg-amber-950/40 border border-amber-800/60 p-5 rounded-xl shadow-lg">
          <h2 class="text-amber-400 font-bold text-lg flex items-center gap-2 mb-3">
            🌙 Homework Tonight
          </h2>
          <div id="list-homework-tonight" class="space-y-2.5">Loading homework...</div>
        </div>

        <!-- Upcoming Tests & Quizzes -->
        <div class="bg-purple-950/40 border border-purple-800/60 p-5 rounded-xl shadow-lg">
          <h2 class="text-purple-400 font-bold text-lg flex items-center gap-2 mb-3">
            🎯 Upcoming Tests & Quizzes
          </h2>
          <div id="list-tests" class="space-y-2.5">Loading tests...</div>
        </div>
      </div>

      <!-- Major Projects Section -->
      <div class="bg-slate-800/90 border border-slate-700 p-6 rounded-xl shadow-lg">
        <h2 class="text-sky-400 font-bold text-lg mb-4 flex items-center gap-2">
          🚀 Major Projects & Long-Term Deliverables
        </h2>
        <div id="list-projects" class="grid grid-cols-1 md:grid-cols-2 gap-4">Loading projects...</div>
      </div>
    </div>

    <!-- 2. CLASSES VIEW -->
    <div id="view-classes" class="hidden space-y-6">
      <div id="class-filter-bar" class="flex flex-wrap gap-2"></div>
      <div id="list-class-items" class="grid grid-cols-1 md:grid-cols-2 gap-4">Select a class tab above</div>
    </div>

  </main>

  <script>
    // PASTE YOUR GOOGLE APPS SCRIPT WEB APP URL HERE:
    const API_URL = "YOUR_DEPLOYED_APPS_SCRIPT_WEB_APP_URL";

    let globalData = [];

    async function fetchData() {
      if (!API_URL || API_URL.includes("YOUR_DEPLOYED")) {
        console.warn("API URL not configured yet.");
        return;
      }
      try {
        const res = await fetch(API_URL);
        const data = await res.json();
        globalData = data.assignments || [];
        renderDashboard();
        renderClasses();
      } catch (err) {
        console.error("Failed to load dashboard data:", err);
      }
    }

    function renderDashboard() {
      const todayStr = new Date().toISOString().split('T')[0];

      // Due Today
      const dueToday = globalData.filter(i => i.due_date === todayStr);
      renderList('list-due-today', dueToday, "No assignments due today! 🎉");

      // Homework Tonight
      const homework = globalData.filter(i => i.category === "Homework" && i.status !== "Completed");
      renderList('list-homework-tonight', homework, "All homework caught up!");

      // Upcoming Tests
      const tests = globalData.filter(i => i.category === "Test/Quiz" && i.status !== "Completed");
      renderList('list-tests', tests, "No upcoming tests or quizzes.");

      // Major Projects
      const projects = globalData.filter(i => i.category === "Project");
      renderList('list-projects', projects, "No active long-term projects.");
    }

    function renderList(elementId, items, emptyMsg) {
      const container = document.getElementById(elementId);
      if (!items || items.length === 0) {
        container.innerHTML = `<p class="text-slate-500 italic text-xs py-2">${emptyMsg}</p>`;
        return;
      }
      container.innerHTML = items.map(item => `
        <div class="bg-slate-900/90 p-3.5 rounded-lg border border-slate-700/80 flex justify-between items-start gap-3">
          <div class="space-y-1">
            <span class="text-[10px] font-bold uppercase px-2 py-0.5 rounded bg-slate-800 text-amber-400 border border-slate-700">${item.class}</span>
            <p class="font-medium text-slate-100 text-sm mt-1 leading-snug">${item.assignment_name}</p>
            ${item.link ? `<a href="${item.link}" target="_blank" class="text-xs text-sky-400 hover:underline inline-block mt-1">🔗 Canvas Link</a>` : ''}
          </div>
          <span class="text-xs text-slate-400 font-mono whitespace-nowrap bg-slate-800 px-2 py-1 rounded">${item.due_date || 'No Date'}</span>
        </div>
      `).join('');
    }

    function renderClasses() {
      const classes = [...new Set(globalData.map(i => i.class))];
      const filterBar = document.getElementById('class-filter-bar');
      filterBar.innerHTML = classes.map(c => `
        <button onclick="filterClass('${c}')" class="px-3.5 py-1.5 rounded-lg text-sm bg-slate-800 border border-slate-700 text-slate-300 hover:bg-amber-500 hover:text-slate-950 font-medium transition">${c}</button>
      `).join('');

      if (classes.length > 0) filterClass(classes[0]);
    }

    function filterClass(className) {
      const filtered = globalData.filter(i => i.class === className);
      renderList('list-class-items', filtered, `No assignments recorded for ${className}.`);
    }

    function switchTab(tab) {
      document.getElementById('view-dashboard').classList.toggle('hidden', tab !== 'dashboard');
      document.getElementById('view-classes').classList.toggle('hidden', tab !== 'classes');
      
      document.getElementById('btn-dashboard').className = tab === 'dashboard' ? 'px-4 py-2 rounded-lg font-medium text-amber-400 bg-slate-800 border border-slate-700' : 'px-4 py-2 rounded-lg font-medium text-slate-400 hover:bg-slate-800 transition';
      document.getElementById('btn-classes').className = tab === 'classes' ? 'px-4 py-2 rounded-lg font-medium text-amber-400 bg-slate-800 border border-slate-700' : 'px-4 py-2 rounded-lg font-medium text-slate-400 hover:bg-slate-800 transition';
    }

    fetchData();
  </script>
</body>
</html>
